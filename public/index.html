<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef2f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10191d" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Harish Krishnakumar — research in reinforcement learning, multimodal reasoning, and computational astrophysics." />
    <script>
      try {
        const savedTheme = sessionStorage.getItem('harish-theme-override');
        const preferredTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const initialTheme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : preferredTheme;
        document.documentElement.dataset.theme = initialTheme;
        document.documentElement.style.colorScheme = initialTheme;
      } catch (_) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Harish Krishnakumar</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
